# Každý pondelok Claude skontroluje svätých na nadchádzajúci mesiac a opravy navrhne cez PR.
name: Weekly saints review

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  review-saints:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Riaď sa CLAUDE.md. V saints.js skontroluj záznamy na najbližších 30 dní od dnešného dátumu:
            správny dátum podľa kalendára na Slovensku, fakty v `story`, pravosť citátu a jeho zdroj,
            roky a slovenskú gramatiku. Oprav len to, čo je naozaj chybné. Ak nič nenájdeš, nič neotváraj.
            Ak si niečo opravil:
              git checkout -b review/$(date +%F)
              git add saints.js && git commit -m "Kontrola svätých: <čo si opravil>"
              git push -u origin HEAD
              gh pr create --fill --base main
          claude_args: |
            --allowedTools "Edit,Read,Bash(git:*),Bash(gh pr create:*),Bash(date:*)"
