# Vygeneruje stránku (node build.mjs) a nasadí ju na GitHub Pages.
# Beží pri pushi a každú noc, aby domovská stránka ukazovala dnešného svätého
# (22:05 aj 23:05 UTC = polnoc v Bratislave v lete aj v zime).
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 22 * * *"
    - cron: "5 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
