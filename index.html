<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Svätý dňa</title>
<meta name="description" content="Každý deň jeden katolícky svätý, jeho citát a inšpirácia z jeho života.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✝️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2c2319; --muted: #6e5c46; --gold: #a8761f; --gold-2: #d4a24c; --line: rgba(168,118,31,.3);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: Inter, system-ui, sans-serif; color: var(--ink); background: #f6ead6;
    padding: 32px 16px 40px; overflow-x: hidden;
  }

  /* scéna: skutočná fotografia kríža na svetlej oblohe (CC0, Unsplash), kríž vždy v strede obrazovky */
  .scene, .scene > * { position: fixed; pointer-events: none; }
  .scene { inset: 0; z-index: 0; overflow: hidden; animation: sunrise 4s ease-out both; }
  @keyframes sunrise { from { filter: brightness(.08) saturate(.4); } 40% { filter: brightness(.55) saturate(.8); } }
  .side, .photo { background-image: url("https://commons.wikimedia.org/wiki/Special:FilePath/Cross_and_sunset_(Unsplash).jpg?width=1600"); background-repeat: no-repeat; }
  /* fotka vysoká ako obrazovka; kríž je na 34 % jej šírky, preto ho posúvame do stredu */
  .photo { top: 0; height: 100vh; aspect-ratio: 3207 / 4489; left: calc(50vw - 24.29vh); background-size: cover; }
  /* boky na širokých obrazovkách: krajný 1 % stĺpec oblohy z fotky roztiahnutý do strany – farby na hrane presne nadviažu */
  .side { top: 0; height: 100vh; }
  .side-l { left: 0; width: calc(50vw - 24.29vh + 1px); background-size: calc((50vw - 24.29vh) * 100) 100vh; background-position: left top; }
  .side-r { right: 0; width: calc(50vw - 47.15vh + 1px); background-size: calc((50vw - 47.15vh) * 100) 100vh; background-position: right top; }
  .photo {
    transform-origin: 34% 30%; animation: breath 50s ease-in-out infinite alternate;
  }
  @keyframes breath { to { scale: 1.06; } }
  /* zosvetlenie – nádych svitania */
  .veil { inset: 0; background: linear-gradient(rgba(255,250,240,.28), rgba(255,250,240,.05) 45%, rgba(255,244,225,.25)); }
  /* Božie svetlo, ktoré pokojne dýcha za krížom */
  .glow {
    inset: 0; mix-blend-mode: screen;
    background: radial-gradient(circle at 50% 30%, rgba(255,247,225,.55), rgba(255,230,180,.18) 22%, transparent 45%);
    animation: pulse 8s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
  canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  main { position: relative; z-index: 1; width: min(680px, 100%); margin: 0 auto; text-align: center; animation: rise 1.6s 2s both; }
  @keyframes rise { from { opacity: 0; translate: 0 24px; } }
  .date { font-size: .8rem; letter-spacing: .3em; text-transform: uppercase; color: var(--ink); text-shadow: 0 0 12px #fff, 0 0 4px #fff; }
  .badge {
    display: inline-block; margin-top: 12px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--gold); font-size: .78rem; letter-spacing: .08em;
    background: rgba(255,255,255,.6); backdrop-filter: blur(6px);
  }

  /* karta začína pod krížom, aby ho nezakryla; pri skrolovaní po ňom prejde */
  .card {
    position: relative; margin-top: max(24px, calc(58vh - 110px)); padding: 36px 28px; border-radius: 28px;
    background: rgba(255,251,243,.8); border: 1px solid rgba(255,255,255,.8);
    backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 30px 80px rgba(90,65,30,.25);
  }
  .portrait { min-height: 240px; display: grid; place-items: center; margin-bottom: 24px; font-size: 64px; }
  .frame {
    position: relative; padding: 5px; border-radius: 14px;
    background: linear-gradient(135deg, #f3d38a, #8a5a12 45%, var(--gold-2) 70%, #fff3cf);
    animation: glow 4s ease-in-out infinite, pop 1s cubic-bezier(.2,1.4,.4,1) both;
  }
  .frame img { display: block; max-height: 240px; max-width: min(260px, 70vw); border-radius: 10px; opacity: 0; transition: opacity 1s; }
  .frame img.loaded { opacity: 1; }
  .frame .sym {
    position: absolute; right: -14px; bottom: -14px; width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; font-size: 22px; background: #fffaf0; border: 1px solid var(--line);
  }
  @keyframes pop { from { scale: .8; opacity: 0; } }
  @keyframes glow {
    0%,100% { box-shadow: 0 6px 24px rgba(168,118,31,.25); }
    50%     { box-shadow: 0 6px 40px rgba(212,162,76,.5); }
  }

  h1 {
    font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1;
    background: linear-gradient(90deg, #7a4e0e, #c8912e, #7a4e0e);
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  .meta { margin-top: 8px; color: var(--muted); font-size: .9rem; }

  blockquote {
    margin: 32px 0 8px; font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500;
    font-size: clamp(1.4rem, 4.2vw, 1.9rem); line-height: 1.35;
  }
  blockquote::before, blockquote::after { color: var(--gold); }
  blockquote::before { content: "„"; } blockquote::after { content: "“"; }
  .w { display: inline-block; opacity: 0; filter: blur(6px); translate: 0 8px; animation: word .7s forwards; }
  @keyframes word { to { opacity: 1; filter: blur(0); translate: 0 0; } }
  .source { color: var(--muted); font-size: .82rem; }

  .divider { width: 60px; height: 1px; margin: 28px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .story { color: #3d3226; line-height: 1.7; font-size: 1rem; max-width: 52ch; margin: 0 auto; }

  .fade { opacity: 0; translate: 0 14px; animation: fadeUp .8s forwards; }
  @keyframes fadeUp { to { opacity: 1; translate: 0 0; } }

  nav { display: flex; gap: 12px; justify-content: center; margin-top: 28px; }
  button {
    font: inherit; color: var(--ink); background: rgba(255,255,255,.7); border: 1px solid rgba(255,255,255,.9);
    border-radius: 999px; padding: 10px 18px; cursor: pointer; transition: .25s; backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(60,45,20,.15);
  }
  button:hover, button:focus-visible { border-color: var(--gold-2); color: var(--gold); box-shadow: 0 0 20px rgba(212,162,76,.45); outline: none; }
  footer { margin-top: 28px; font-size: .8rem; color: #fff; text-shadow: 0 1px 6px rgba(40,50,20,.6); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="side side-l"></div><div class="side side-r"></div><div class="photo"></div><div class="veil"></div><div class="glow"></div>
</div>
<canvas id="motes"></canvas>

<main>
  <div class="date" id="date"></div>
  <div class="badge" id="badge"></div>
  <article class="card" id="card" aria-live="polite"></article>
  <nav>
    <button id="prev" aria-label="Predchádzajúci deň">‹ Včera</button>
    <button id="today">Dnes</button>
    <button id="next" aria-label="Nasledujúci deň">Zajtra ›</button>
  </nav>
  <footer>Svätí sú ľudia, cez ktorých presvitá svetlo.</footer>
</main>

<script src="saints.js"></script>
<script>
  const S = window.SAINTS;
  const $ = id => document.getElementById(id);
  let offset = 0; // dni od dneška

  const pad = n => String(n).padStart(2, "0");
  const dayOfYear = d => Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0)) / 864e5);

  // ak má niekto v ten deň sviatok, ukáž jeho; inak deterministicky rotuj podľa dňa v roku
  function pick(d) {
    const key = `${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const feast = S.find(s => s.feast === key);
    return feast ? [feast, true] : [S[dayOfYear(d) % S.length], false];
  }

  const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  let intro = 2.6; // pri prvom načítaní počkaj, kým vyjde svetlo za krížom
  function render() {
    const t0 = intro; intro = 0;
    const d = new Date(); d.setDate(d.getDate() + offset);
    const [s, isFeast] = pick(d);
    const [m, day] = s.feast.split("-").map(Number);

    $("date").textContent = d.toLocaleDateString("sk-SK", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    $("badge").textContent = isFeast ? "✦ Dnes slávime sviatok ✦" : `Svätec dňa · sviatok ${day}. ${m}.`;
    $("today").hidden = offset === 0;

    const words = s.quote.split(" ").map((w, i) => `<span class="w" style="animation-delay:${t0 + .6 + i * .08}s">${esc(w)}</span>`).join(" ");
    const after = t0 + .6 + s.quote.split(" ").length * .08 + .3;
    const src = `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(s.img)}?width=500`;
    $("card").innerHTML = `
      <div class="portrait">
        <div class="frame"><img src="${src}" alt="${esc(s.name)}"><span class="sym">${s.symbol}</span></div>
      </div>
      <h1 class="fade" style="animation-delay:${t0 + .1}s">${esc(s.name)}</h1>
      <div class="meta fade" style="animation-delay:${t0 + .3}s">${esc(s.title)} · ${esc(s.years)}</div>
      <blockquote>${words}</blockquote>
      <div class="source fade" style="animation-delay:${after}s">— ${esc(s.source)}</div>
      <div class="divider fade" style="animation-delay:${after + .2}s"></div>
      <p class="story fade" style="animation-delay:${after + .4}s">${esc(s.story)}</p>`;
    const img = $("card").querySelector(".frame img");
    img.onload = () => img.classList.add("loaded");
    img.onerror = () => img.parentNode.replaceWith(s.symbol);
  }

  const go = n => { offset = n === 0 ? 0 : offset + n; render(); };
  $("prev").onclick = () => go(-1);
  $("next").onclick = () => go(1);
  $("today").onclick = () => go(0);
  addEventListener("keydown", e => { if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1); });
  let x0 = null;
  addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
  addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 60) go(dx > 0 ? -1 : 1); x0 = null; });
  render();

  // svetielka stúpajú zo zeme k nebu ako modlitby
  const c = $("motes"), ctx = c.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr = devicePixelRatio;
  let W, H, motes = [];
  const resize = () => { W = c.width = innerWidth * dpr; H = c.height = innerHeight * dpr; };
  const mote = (y = Math.random() * H) => ({ x: Math.random() * W, y, s: (Math.random() * 1.8 + .6) * dpr, v: Math.random() * .35 + .12, p: Math.random() * 6.28 });
  resize(); addEventListener("resize", resize);
  for (let i = 0; i < 60; i++) motes.push(mote());
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const m of motes) {
      m.y -= m.v * dpr; m.p += .02;
      if (m.y < -10) Object.assign(m, mote(H + 10));
      const a = (.55 + Math.sin(m.p) * .35) * Math.min(1, m.y / (H * .3));
      ctx.beginPath(); ctx.arc(m.x + Math.sin(m.p) * 8, m.y, m.s, 0, 6.28);
      ctx.fillStyle = `rgba(255,250,235,${a})`; ctx.shadowColor = "#ffd98a"; ctx.shadowBlur = 10; ctx.fill();
    }
    if (!still) requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
