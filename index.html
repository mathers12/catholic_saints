<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Svätý dňa</title>
<meta name="description" content="Každý deň jeden katolícky svätý, jeho citát a inšpirácia z jeho života.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #0b0f2a; --bg2: #1b1446; --bg3: #3a1d4f;
    --gold: #f3d38a; --gold-2: #e7b453; --text: #f4efe6; --muted: #b8b3c9;
    --glass: rgba(255,255,255,.06); --line: rgba(243,211,138,.25);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: Inter, system-ui, sans-serif; color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg3), var(--bg2) 45%, var(--bg1) 100%) fixed;
    display: grid; place-items: center; padding: 32px 16px; overflow-x: hidden;
  }
  canvas, .bg, .bg > * { position: fixed; pointer-events: none; }
  canvas { inset: 0; z-index: 0; }
  .bg { inset: 0; z-index: 0; overflow: hidden; }

  /* portrét svätého rozmazaný cez celú scénu – každý deň iná farebnosť */
  .ambient {
    inset: -10%; background: center / cover no-repeat; filter: blur(70px) saturate(1.4);
    opacity: 0; transition: opacity 1.4s ease;
  }
  .ambient.on { opacity: .38; }

  /* polárna žiara vo farbách vitráže */
  .aurora { width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(90px); opacity: .45; mix-blend-mode: screen; }
  .a1 { background: #7b3fe4; left: -15vmax; top: -20vmax; animation: drift1 26s ease-in-out infinite alternate; }
  .a2 { background: #c2410c; right: -20vmax; top: 10vh;   animation: drift2 32s ease-in-out infinite alternate; }
  .a3 { background: #1e6fd9; left: 20vw;    bottom: -30vmax; animation: drift1 38s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { to { translate: 18vw 14vh; scale: 1.2; } }
  @keyframes drift2 { to { translate: -22vw 18vh; scale: .85; } }

  /* rozeta gotickej katedrály, ktorá sa pomaly otáča za kartou */
  .rose {
    left: 50%; top: 42%; width: min(1100px, 170vw); aspect-ratio: 1; translate: -50% -50%;
    opacity: .16; animation: spin 180s linear infinite;
    mask: radial-gradient(circle, #000 35%, transparent 70%);
  }
  @keyframes spin { to { rotate: 360deg; } }

  /* jemná vineta, aby text vždy vynikol */
  .vignette { inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(5,6,20,.75)); }

  main { position: relative; z-index: 1; width: min(680px, 100%); text-align: center; }
  .date { font-size: .8rem; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
  .badge {
    display: inline-block; margin: 12px 0 28px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--gold); font-size: .78rem; letter-spacing: .08em;
  }

  .card {
    position: relative; padding: 36px 28px; border-radius: 28px;
    background: rgba(12,10,35,.45); border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08);
  }
  /* celý obrázok bez orezania, zmenšený a vycentrovaný v zlatom ráme */
  .portrait { min-height: 240px; display: grid; place-items: center; margin-bottom: 24px; font-size: 64px; }
  .frame {
    position: relative; padding: 5px; border-radius: 14px;
    background: linear-gradient(135deg, var(--gold), #7a5a1c 45%, var(--gold-2) 70%, #fff3cf);
    animation: glow 4s ease-in-out infinite, pop 1s cubic-bezier(.2,1.4,.4,1) both;
  }
  .frame img {
    display: block; max-height: 240px; max-width: min(260px, 70vw); border-radius: 10px;
    opacity: 0; transition: opacity 1s;
  }
  .frame img.loaded { opacity: 1; }
  .frame .sym {
    position: absolute; right: -14px; bottom: -14px; width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; font-size: 22px; background: #1b1446; border: 1px solid var(--line);
  }
  @keyframes pop { from { scale: .8; opacity: 0; } }
  @keyframes glow {
    0%,100% { box-shadow: 0 0 30px 4px rgba(243,211,138,.2); }
    50%     { box-shadow: 0 0 55px 12px rgba(243,211,138,.4); }
  }

  h1 {
    font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1;
    background: linear-gradient(90deg, var(--gold), #fff6dc, var(--gold));
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 6s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  .meta { margin-top: 8px; color: var(--muted); font-size: .9rem; }

  blockquote {
    margin: 32px 0 8px; font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500;
    font-size: clamp(1.4rem, 4.2vw, 1.9rem); line-height: 1.35;
  }
  blockquote::before, blockquote::after { color: var(--gold); opacity: .8; }
  blockquote::before { content: "„"; } blockquote::after { content: "“"; }
  .w { display: inline-block; opacity: 0; filter: blur(6px); translate: 0 8px; animation: word .7s forwards; }
  @keyframes word { to { opacity: 1; filter: blur(0); translate: 0 0; } }
  .source { color: var(--muted); font-size: .82rem; }

  .divider { width: 60px; height: 1px; margin: 28px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .story { color: #ddd6ea; line-height: 1.7; font-size: 1rem; max-width: 52ch; margin: 0 auto; }

  .fade { opacity: 0; translate: 0 14px; animation: fadeUp .8s forwards; }
  @keyframes fadeUp { to { opacity: 1; translate: 0 0; } }

  nav { display: flex; gap: 12px; justify-content: center; margin-top: 28px; }
  button {
    font: inherit; color: var(--text); background: var(--glass); border: 1px solid rgba(255,255,255,.14);
    border-radius: 999px; padding: 10px 18px; cursor: pointer; transition: .25s;
  }
  button:hover, button:focus-visible { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 20px rgba(243,211,138,.25); outline: none; }
  footer { margin-top: 28px; font-size: .75rem; color: var(--muted); opacity: .7; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
  <div class="ambient" id="ambA"></div><div class="ambient" id="ambB"></div>
  <svg class="rose" id="rose" viewBox="-100 -100 200 200" fill="none" stroke="#f3d38a" stroke-width=".4"></svg>
  <div class="vignette"></div>
</div>
<canvas id="sky"></canvas>

<main>
  <div class="date" id="date"></div>
  <div class="badge" id="badge"></div>
  <article class="card" id="card" aria-live="polite"></article>
  <nav>
    <button id="prev" aria-label="Predchádzajúci deň">‹ Včera</button>
    <button id="today">Dnes</button>
    <button id="next" aria-label="Nasledujúci deň">Zajtra ›</button>
  </nav>
  <footer>Svätí sú ľudia, cez ktorých presvitá svetlo.</footer>
</main>

<script src="saints.js"></script>
<script>
  const S = window.SAINTS;
  const $ = id => document.getElementById(id);
  let offset = 0; // dni od dneška

  const pad = n => String(n).padStart(2, "0");
  const dayOfYear = d => Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0)) / 864e5);

  // ak má niekto v ten deň sviatok, ukáž jeho; inak deterministicky rotuj podľa dňa v roku
  function pick(d) {
    const key = `${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const feast = S.find(s => s.feast === key);
    return feast ? [feast, true] : [S[dayOfYear(d) % S.length], false];
  }

  const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  function render() {
    const d = new Date(); d.setDate(d.getDate() + offset);
    const [s, isFeast] = pick(d);
    const [m, day] = s.feast.split("-").map(Number);

    $("date").textContent = d.toLocaleDateString("sk-SK", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    $("badge").textContent = isFeast ? "✦ Dnes slávime sviatok ✦" : `Svätec dňa · sviatok ${day}. ${m}.`;
    $("today").hidden = offset === 0;

    const words = s.quote.split(" ").map((w, i) => `<span class="w" style="animation-delay:${.6 + i * .08}s">${esc(w)}</span>`).join(" ");
    const after = .6 + s.quote.split(" ").length * .08 + .3;
    const file = encodeURIComponent(s.img);
    const src = `https://commons.wikimedia.org/wiki/Special:FilePath/${file}?width=500`;
    setAmbient(`https://commons.wikimedia.org/wiki/Special:FilePath/${file}?width=120`);
    $("card").innerHTML = `
      <div class="portrait">
        <div class="frame"><img src="${src}" alt="${esc(s.name)}"><span class="sym">${s.symbol}</span></div>
      </div>
      <h1 class="fade" style="animation-delay:.1s">${esc(s.name)}</h1>
      <div class="meta fade" style="animation-delay:.3s">${esc(s.title)} · ${esc(s.years)}</div>
      <blockquote>${words}</blockquote>
      <div class="source fade" style="animation-delay:${after}s">— ${esc(s.source)}</div>
      <div class="divider fade" style="animation-delay:${after + .2}s"></div>
      <p class="story fade" style="animation-delay:${after + .4}s">${esc(s.story)}</p>`;
    const img = $("card").querySelector(".frame img");
    img.onload = () => img.classList.add("loaded");
    img.onerror = () => img.parentNode.replaceWith(s.symbol);
  }

  // dve vrstvy pozadia sa prelínajú, aby zmena svätého bola plynulá
  let ambFront = false;
  function setAmbient(url) {
    const [show, hide] = ambFront ? [$("ambA"), $("ambB")] : [$("ambB"), $("ambA")];
    ambFront = !ambFront;
    const img = new Image();
    img.onload = () => { show.style.backgroundImage = `url("${url}")`; show.classList.add("on"); hide.classList.remove("on"); };
    img.src = url;
  }

  // rozeta: sústredné kruhy + 12 lupeňov + lúče
  $("rose").innerHTML = [30, 55, 80, 96].map(r => `<circle r="${r}"/>`).join("") +
    Array.from({ length: 12 }, (_, i) => `<g transform="rotate(${i * 30})">
      <circle cy="-42" r="13"/><circle cy="-68" r="12"/><circle cy="-88" r="6"/>
      <path d="M0-30L0-96M-10-55Q0-80 10-55"/></g>`).join("");

  const go = n => { offset = n === 0 ? 0 : offset + n; render(); };
  $("prev").onclick = () => go(-1);
  $("next").onclick = () => go(1);
  $("today").onclick = () => go(0);
  addEventListener("keydown", e => { if (e.key === "ArrowLeft") go(-1); if (e.key === "ArrowRight") go(1); });
  let x0 = null;
  addEventListener("touchstart", e => x0 = e.touches[0].clientX, { passive: true });
  addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 60) go(dx > 0 ? -1 : 1); x0 = null; });
  render();

  // zlaté svetielka stúpajúce k nebu
  const c = $("sky"), ctx = c.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, motes = [], stars = [];
  const resize = () => {
    W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio;
    stars = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * devicePixelRatio, p: Math.random() * 6.28 }));
  };
  const mote = (y = Math.random() * H) => ({ x: Math.random() * W, y, r: (Math.random() * 1.8 + .4) * devicePixelRatio, v: Math.random() * .4 + .15, p: Math.random() * 6.28 });
  resize(); addEventListener("resize", resize);
  for (let i = 0; i < 70; i++) motes.push(mote());
  (function tick() {
    ctx.clearRect(0, 0, W, H);
    ctx.shadowBlur = 0;
    for (const s of stars) {
      s.p += .015;
      ctx.fillStyle = `rgba(255,255,255,${.25 + Math.sin(s.p) * .25})`;
      ctx.fillRect(s.x, s.y, s.r + .5, s.r + .5);
    }
    for (const m of motes) {
      m.y -= m.v * devicePixelRatio; m.p += .02;
      if (m.y < -10) Object.assign(m, mote(H + 10));
      const a = .35 + Math.sin(m.p) * .3;
      ctx.beginPath(); ctx.arc(m.x + Math.sin(m.p) * 6, m.y, m.r, 0, 6.28);
      ctx.fillStyle = `rgba(243,211,138,${a})`; ctx.shadowColor = "#f3d38a"; ctx.shadowBlur = 12; ctx.fill();
    }
    if (!still) requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
